    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f9fafb;
      }

      /* Transcript: thin scrollbar + soft top/bottom edge fade */
      .transcript-scroll {
        scrollbar-width: thin;
        scrollbar-color: #cbd5e1 transparent;
        -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 18px, #000 calc(100% - 18px), transparent 100%);
                mask-image: linear-gradient(to bottom, transparent 0, #000 18px, #000 calc(100% - 18px), transparent 100%);
      }
      .transcript-scroll::-webkit-scrollbar { width: 6px; }
      .transcript-scroll::-webkit-scrollbar-track { background: transparent; }
      .transcript-scroll::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 9999px; }
      .transcript-scroll::-webkit-scrollbar-thumb:hover { background-color: #94a3b8; }

      /* Transcript: staggered message entrance */
      @keyframes msgIn {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .animate-msg-in { animation: msgIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) both; }
      @media (prefers-reduced-motion: reduce) {
        .animate-msg-in { animation: none; }
      }
    </style>
