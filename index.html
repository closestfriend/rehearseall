
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      ⚠️ TEMPORARY noindex — blocks ALL search indexing on purpose.
      Reason: the API gateway has no authentication or usage quota yet, so the
      site is kept un-discoverable until that is addressed (see docs/PRE-LAUNCH-CHECKLIST.md).
      REMOVE this tag (and public/robots.txt) before public launch.
      Symptom if you forget: the site gets zero organic search traffic and you
      cry yourself to sleep wondering why.
    -->
    <meta name="robots" content="noindex, nofollow" />
    <title>RehearseAll — Practice the room before you enter it</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Theme system fonts: Space Grotesk (Personal Best) + IBM Plex Mono (Transcript) -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f9fafb;
      }

      /* Transcript: thin scrollbar + soft top/bottom edge fade */
      .transcript-scroll {
        scrollbar-width: thin;
        scrollbar-color: #cbd5e1 transparent;
        -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 18px, #000 calc(100% - 18px), transparent 100%);
                mask-image: linear-gradient(to bottom, transparent 0, #000 18px, #000 calc(100% - 18px), transparent 100%);
      }
      .transcript-scroll::-webkit-scrollbar { width: 6px; }
      .transcript-scroll::-webkit-scrollbar-track { background: transparent; }
      .transcript-scroll::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 9999px; }
      .transcript-scroll::-webkit-scrollbar-thumb:hover { background-color: #94a3b8; }

      /* Transcript: staggered message entrance */
      @keyframes msgIn {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .animate-msg-in { animation: msgIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) both; }
      @media (prefers-reduced-motion: reduce) {
        .animate-msg-in { animation: none; }
      }

      /* Theme system: Personal Best + Transcript ambient animation keyframes.
         Kept global (not per-component) since Tailwind is CDN-loaded here with
         no build-time config to extend with custom keyframes. */
      @keyframes hpGlowPulse { 0%,100% { text-shadow: 0 0 28px rgba(212,242,34,.55), 0 0 90px rgba(212,242,34,.3); } 50% { text-shadow: 0 0 40px rgba(212,242,34,.8), 0 0 130px rgba(212,242,34,.45); } }
      @keyframes hpMarquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
      @keyframes hpBlink { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
      @keyframes hpDrift { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(4%,6%) scale(1.12); } }
      @keyframes hpCaret { 0%,45% { opacity: 1; } 50%,100% { opacity: 0; } }
      @keyframes hpOrbBreathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }
      @keyframes hpStamp { 0% { transform: rotate(-8deg) scale(2.2); opacity: 0; } 60% { transform: rotate(-8deg) scale(.94); opacity: 1; } 80% { transform: rotate(-8deg) scale(1.04); } 100% { transform: rotate(-8deg) scale(1); opacity: 1; } }
      @keyframes hpPulseFade { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
      @keyframes hpBar { 0%,100% { transform: scaleY(.3); } 50% { transform: scaleY(1); } }
      @media (prefers-reduced-motion: reduce) {
        [data-theme] [data-anim] { animation: none !important; }
      }
    </style>
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
